services:
  # Monorepo npm: runtime docker reutiliza el Dockerfile que se valida con
  # `docker compose up --build` (context = raiz del repo, workspaces correctos).
  # Render busca render.yaml en la raiz del repo.
  - type: web
    name: tpv-restaurante
    runtime: docker
    dockerfilePath: tpv-restaturante/Dockerfile
    dockerContext: .
    plan: free
    # El Dockerfile tiene ENTRYPOINT ./docker-entrypoint.sh + CMD node server.js:
    # crea esquema (drizzle-kit push), arranca y siembra via POST /api/demo-seed.
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: ALLOWED_ORIGINS
        value: https://tpv-restaurante.onrender.com
      # JWT_SECRET/CRON_SECRET se auto-generan en el arranque si no se fijan
      # en el panel (tal como indican la guia de demo y el README).
      - key: JWT_SECRET
        sync: false
      - key: CRON_SECRET
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: tpv-restaurante-db
          property: connectionString
      - key: DB_POOL_MAX
        value: "20"
      - key: DB_POOL_IDLE_MS
        value: "10000"
      - key: DB_CONN_TIMEOUT_MS
        value: "5000"
      # Clave API de la web: definela junto a NEXT_PUBLIC_TPV_API_KEY para que
      # el seed cree la API key 'pos'.
      - key: TPV_API_KEY
        sync: false
      - key: NEXT_PUBLIC_TPV_API_KEY
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: FISKALY_ENVIRONMENT
        value: TEST
      - key: FISKALY_API_KEY
        sync: false
      - key: FISKALY_API_SECRET
        sync: false
      - key: FISKALY_TAXPAYER_NIF
        sync: false
      - key: FISKALY_TERRITORY
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: UBER_WEBHOOK_SECRET
        sync: false
      - key: GLOVO_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_LOCATION_NAME
        sync: false
      - key: STRIPE_LOCATION_LINE1
        sync: false
      - key: STRIPE_LOCATION_CITY
        sync: false
      - key: STRIPE_LOCATION_STATE
        sync: false
      - key: STRIPE_LOCATION_COUNTRY
        value: ES
      - key: STRIPE_LOCATION_POSTAL_CODE
        sync: false

databases:
  - name: tpv-restaurante-db
    databaseName: tpv_restaurant_demo
    user: tpv
    plan: free