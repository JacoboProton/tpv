services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: tpv
      POSTGRES_PASSWORD: tpv_local_dev
      POSTGRES_DB: tpv_restaurant
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tpv -d tpv_restaurant"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: ..
      dockerfile: tpv-restaturante/Dockerfile
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://tpv:tpv_local_dev@postgres:5432/tpv_restaurant
      # La web client usa esta clave; el seed crea la API key 'pos' con su hash.
      TPV_API_KEY: dev_local_key_cambiar
      NEXT_PUBLIC_TPV_API_KEY: dev_local_key_cambiar
      # Fija para que las sesiones sobrevivan a reinicios del contenedor.
      JWT_SECRET: dev_jwt_secret_demo_local_0123456789abcdef
      # Permite CORS desde el navegador en localhost (origin cruzado al dev).
      ALLOWED_ORIGINS: http://localhost:3000,http://localhost:3001,http://127.0.0.1:3000
      CRON_SECRET: dev_cron_secret_demo_local
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata: