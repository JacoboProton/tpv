name: Publish @tpv/core

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version bump: patch | minor | major'
        required: true
        default: 'patch'

jobs:
  publish:
    name: Build, verify types & publish
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org/

      - name: Install dependencies
        run: npm ci
        working-directory: packages/core

      - name: Run tests
        run: npm test
        working-directory: packages/core

      - name: Verify published types (attw)
        run: npm run attw
        working-directory: packages/core

      - name: Bump version
        run: npm version ${{ github.event.inputs.version }} --no-git-tag-version
        working-directory: packages/core

      - name: Publish to npm
        run: npm publish --access public
        working-directory: packages/core
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Commit version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/core/package.json packages/core/package-lock.json
          git commit -m "chore(core): bump @tpv/core version"
          git push
